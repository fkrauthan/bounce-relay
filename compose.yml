services:
  db:
    image: postgres:15.5-alpine
    environment:
      POSTGRES_USER: bounce_relay
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: bounce_relay_test
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bounce_relay -d bounce_relay_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
